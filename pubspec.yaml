name: video_partial_cache
description: Transparent progressive (partial) on-disk caching for MP4 / progressive video URLs through a local byte-range proxy. Pure Dart.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  shelf: ^1.4.3
  http: ^1.6.0
  hive_ce: ^2.24.0
  path_provider: ^2.1.6
  path: ^1.9.1
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
